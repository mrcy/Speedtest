services:
  - type: web
    name: nova-speedtest-backend
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/librespeed/Dockerfile
    dockerContext: ./deploy/librespeed
    healthCheckPath: /
    envVars:
      - key: MODE
        value: standalone
      - key: WEBPORT
        value: "10000"

  - type: web
    name: nova-speedtest
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LIBRESPEED_SERVER_URL
        fromService:
          type: web
          name: nova-speedtest-backend
          property: host
